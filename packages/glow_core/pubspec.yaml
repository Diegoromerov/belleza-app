name: glow_core
description: Shared core for GlowApp client and provider apps
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.1.0
  shared_preferences: ^2.2.2
  google_sign_in: ^6.2.1
  flutter_secure_storage: ^9.0.0
  geocoding: ^3.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  image_picker: ^1.0.7
  web_socket_channel: ^3.0.1
  geolocator: ^10.1.0
  shimmer: ^3.0.0
  camera: ^0.10.5
  google_mlkit_face_detection: ^0.10.0
  image: ^4.1.3
  flutter_svg: ^2.0.9
  flutter_markdown_plus: ^1.0.0
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  speech_to_text: ^7.4.0
  permission_handler: ^12.0.3
  mobile_scanner: ^5.2.2
  video_player: ^2.9.2
  just_audio: ^0.9.36
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^18.0.1
  flutter_riverpod: ^2.4.0
  url_launcher: ^6.2.0
  share_plus: ^12.0.2
  fl_chart: ^0.68.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.13
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
    - family: CormorantGaramond
      fonts:
        - asset: assets/fonts/CormorantGaramond-Regular.ttf
        - asset: assets/fonts/CormorantGaramond-Medium.ttf
          weight: 500
        - asset: assets/fonts/CormorantGaramond-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/CormorantGaramond-Bold.ttf
          weight: 700
