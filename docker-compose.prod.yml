version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    env_file:
      - ./backend/.env.production
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=glowapp
      - POSTGRES_USER=glowapp
      # Sin valor por defecto: `${VAR:?mensaje}` aborta el despliegue si POSTGRES_PASSWORD
      # no llega al entorno. Antes traía `:-changeme_en_despliegue`, una credencial conocida
      # por cualquiera que leyera el repo. El valor va entre comillas porque el mensaje de
      # error de compose contiene `: ` y el YAML lo leería como un mapa.
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio en produccion (definela en el entorno del despliegue)}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
