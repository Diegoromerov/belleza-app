# railway.yml - Railway deployment configuration for pgvector PostgreSQL
# CRITICAL: Service NAME must be UNIQUE to force new volume creation
# Railway associates volumes with SERVICE NAME, not volumes.name in YAML
# Changing service name from "postgres" to "pgvector-db" forces clean volume
#
# ---------------------------------------------------------------------------
# SECRETS POLICY (P0 infra/observabilidad - t_fix_infra_01 / AUD-INFRA-01 #1)
# Este archivo esta TRACKEADO en git => NO declara secretos.
#
# Los valores sensibles se inyectan como variables de ENTORNO del servicio
# (Railway dashboard -> Variables, o `railway variables --set`), NUNCA aqui,
# de modo que puedan rotarse sin editar el repositorio ni redesplegar.
#
# Inventario de nombres requeridos por el entorno (valores fuera de git):
#   ver `.env.example` (raiz).
#     POSTGRES_PASSWORD  REDIS_PASSWORD  JWT_SECRET  GEMINI_API_KEY
#     DEEPSEEK_API_KEY   FAL_KEY         REPLICATE_API_TOKEN
# ---------------------------------------------------------------------------

services:
  pgvector-db:                    # ← UNIQUE name forces NEW volume (was "postgres")
    dockerfilePath: Dockerfile.postgres
    restartPolicyType: ON_FAILURE
    variables:
      # POSTGRES_PASSWORD se inyecta por entorno (Railway Variables).
      - name: POSTGRES_DB
        value: railway
      - name: POSTGRES_USER
        value: postgres
    volumes:
      - name: pgvector-db-data    # New volume name
        mountPath: /var/lib/postgresql/data
    healthCheckPath: /health
    healthCheckInterval: 30

  redis:
    image: redis:7-alpine
    container_name: beauty-redis
    # REDIS_PASSWORD se inyecta por entorno (Railway Variables).
    volumes:
      - name: redis-data
        mountPath: /data
    healthCheckPath: /health
    healthCheckInterval: 30

  ai-worker:
    build:
      context: ../ai-worker
      dockerfile: Dockerfile
    container_name: beauty-ai-worker
    variables:
      # FAL_KEY y REPLICATE_API_TOKEN se inyectan por entorno (Railway Variables).
      - name: REDIS_HOST
        value: redis
      - name: REDIS_PORT
        value: "6379"
      - name: MOCK_MODE
        value: "true"
    depends_on:
      redis:
        condition: service_healthy
    healthCheckPath: /health
    healthCheckInterval: 30

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: beauty-backend
    variables:
      # DB_PASSWORD, JWT_SECRET, GEMINI_API_KEY y DEEPSEEK_API_KEY se inyectan
      # por entorno (Railway Variables) — no se declaran en este archivo.
      - name: PORT
        value: "8080"
      - name: DB_HOST
        value: pgvector-db          # ← Updated to new pgvector service name
      - name: DB_PORT
        value: "5432"
      - name: DB_NAME
        value: railway
      - name: DB_USER
        value: postgres
      - name: REDIS_HOST
        value: redis
      - name: REDIS_PORT
        value: "6379"
      - name: NODE_ENV
        value: production
      - name: ALLOWED_ORIGINS
        value: ${ALLOWED_ORIGINS}
      - name: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - name: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com/v1/chat/completions
    depends_on:
      pgvector-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthCheckPath: /health
    healthCheckInterval: 30
