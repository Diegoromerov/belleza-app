name: Test Backend CI

on:
  push:
    branches: [ staging ]

jobs:
  backend-ci:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: glowtest
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [ 5432:5432 ]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      JWT_SECRET: ci_secret_key_glowapp_2026_super_secure
      PORT: 3000
      DATABASE_URL_ADMIN: postgres://postgres:***@localhost:5432/glowtest
      RLS_ROLE_PASSWORD: ci_only_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.x', cache: 'npm', cache-dependency-path: backend/package-lock.json }
      - name: Install Backend Dependencies
        run: cd backend && npm ci --legacy-peer-deps
      - name: Echo test
        run: echo "backend ci test"
