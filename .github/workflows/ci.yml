name: GlowApp CI / CD Pipeline

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]

jobs:
  backend-ci:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: ci_secret_key_glowapp_2026_super_secure
      PORT: 3000
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci --legacy-peer-deps

      - name: Run Backend Integration & Unit Tests
        run: |
          cd backend
          npm test -- --coverage --forceExit

  frontend-ci:
    name: Frontend Flutter Analyze & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter Engine
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd frontend
          flutter pub get

      - name: Run Flutter Static Analysis
        run: |
          cd frontend
          flutter analyze
