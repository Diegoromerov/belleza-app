name: GlowApp CI / CD Pipeline

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]

jobs:
  backend-ci:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest

    # PostgreSQL REAL.
    # Hasta ahora este job no levantaba base de datos y, además, `database.js`
    # ignoraba DATABASE_URL cuando NODE_ENV=test: aunque se hubiera levantado, los
    # tests habrían seguido hablando con pg-mem y el aislamiento multi-tenant no se
    # habría probado nunca en CI. Ahora la precedencia está invertida (DATABASE_URL
    # gana) y el job levanta el servidor.
    # La imagen lleva PostGIS porque 067 declara `geography(Point,4326)`.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: glowtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      JWT_SECRET: ci_secret_key_glowapp_2026_super_secure
      PORT: 3000
      DATABASE_URL_ADMIN: postgres://postgres:postgres@localhost:5432/glowtest
      # Contraseña de los roles RLS. La base es efímera: vive lo que vive el
      # runner, así que no es un secreto que proteger.
      RLS_ROLE_PASSWORD: ci_only_password
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci --legacy-peer-deps

      - name: Compuerta anti-marcadores de conflicto (bloqueante)
        run: |
          cd backend
          node scripts/checkNoConflictMarkers.js

      - name: Escaneo de credenciales versionadas (bloqueante)
        run: |
          cd backend
          node scripts/verifyNoVersionedSecrets.js

      # Guard de numeración de migraciones (bloqueante). Corre AQUÍ, junto a las otras
      # compuertas estáticas y antes de levantar PostgreSQL, por dos razones:
      # (1) el fallo es del repositorio, no de la base, y debe verse en los primeros
      # segundos; (2) el paso de jest queda `skipped` detrás de la preparación del
      # esquema (CI-46), así que un guard que viviera solo dentro de jest no se
      # ejecutaría. Dos ramas eligiendo el mismo número no es cosmético: el runner
      # ordena alfabéticamente y aplica AMBAS, en un orden que nadie eligió.
      # Ver backend/migrations/REGISTRY.md.
      - name: Guard de numeración de migraciones (bloqueante)
        run: |
          cd backend
          node tests/migrationsNoDuplicateNumbers.test.js
      # FIX-FLUTTER-09 — Contract testing OpenAPI (bloqueante).
      # El contrato (backend/openapi/openapi.json) se regenera desde el app real y
      # se compara con el artefacto versionado. Un endpoint nuevo, una ruta
      # renombrada o un método cambiado sin regenerar el contrato pone el CI en
      # rojo AQUI, antes de llegar al cliente Flutter.
      - name: Compuerta de contrato OpenAPI (deriva de API)
        run: |
          cd backend
          set -o pipefail
          node scripts/checkOpenApiSpec.js 2>&1 | tee /tmp/openapi-drift.log
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::Compuerta de contrato OpenAPI en rojo (exit $rc)"
            tail -30 /tmp/openapi-drift.log | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $rc

      # Los tests de contrato se excluyen del patron del gate de jest
      # ('--testPathIgnorePatterns=...|contract|...'), por eso corren en su propio
      # paso BLOQUEANTE: si no, la compuerta de contrato seria decorativa.
      # --forceExit es necesario: index.js deja handles abiertos (cron, pool) que
      # impiden que jest termine por si solo.
      - name: Tests de contrato (OpenAPI vs rutas reales + endpoints criticos)
        run: |
          cd backend
          set -o pipefail
          npx jest src/tests/contract/openapi.contract.test.js src/tests/contract/critical-endpoints.contract.test.js --runInBand --forceExit 2>&1 | tee /tmp/contract-tests.log
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::Tests de contrato en rojo (exit $rc)"
            grep -E 'Tests:|Test Suites:' /tmp/contract-tests.log | paste -sd ' Â· ' - | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $rc

      # `npm run migrate` es `sequelize.sync({force:true})`: crea tablas desde los
      # modelos, y ninguna política de RLS vive en un modelo. Por eso el esquema y
      # los roles los monta un script propio, con el orden de migraciones probado
      # contra PostgreSQL 16.
      # El error de este paso TIENE que ser legible sin la sesión de GitHub: el log de un
      # run exige login incluso en repo público, y por eso CI-46 lleva días sin poder
      # diagnosticarse. `::error::` escribe en las ANOTACIONES del check-run, que sí son
      # públicas (verificado: se leen por API). Sin este eco, un fallo aquí solo dice
      # «exit 1» y obliga a pedirle el log a una persona.
      - name: Preparar el esquema multi-tenant y los roles RLS
        run: |
          cd backend
          set -o pipefail
          node scripts/prepareRlsDatabase.js 2>&1 | tee /tmp/prep-rls.log
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::prepareRlsDatabase.js falló con exit $rc — últimas 20 líneas:"
            tail -20 /tmp/prep-rls.log | while IFS= read -r l; do echo "::error::$l"; done
            echo "::error::entorno: node $(node -v) · pg cliente: $(pg_isready -h 127.0.0.1 -p 5432 2>&1 || echo 'pg_isready ausente')"
          fi
          exit $rc

      # La compuerta de aislamiento. Falla si alguien quita FORCE de 068, añade
      # una política permisiva (se OR-ean y la laxa gana) o hace que la aplicación
      # se conecte con un rol que se salta RLS.
      - name: Verificar el aislamiento multi-tenant (compuerta RLS)
        env:
          TEST_DATABASE_URL: postgres://app_owner:ci_only_password@localhost:5432/glowtest
        run: |
          cd backend
          set -o pipefail
          node scripts/verifyTenantIsolation.js 2>&1 | tee /tmp/verify-rls.log
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::verifyTenantIsolation.js falló con exit $rc — últimas 20 líneas:"
            tail -20 /tmp/verify-rls.log | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $rc

      # Se ejecuta con el rol de la aplicación (no propietario, sin BYPASSRLS), el
      # mismo con el que corre en producción. Recuento medido el 2026-09-27 sobre
      # `main`, con el comando del propio jest para que se pueda re-derivar:
      #   cd backend && npx jest --listTests   ⇒  92 suites coleccionadas
      #   de ésas, 15 caen en los 9 patrones de exclusión  ⇒  77 corren dentro del gate
      # Patrón 'authRoutes' eliminado por tener 0 coincidencias en archivos (el test real es tests/auth.integration.test.js que corre dentro del gate).
      # Estado del gate medido EN LOCAL sobre `main` (2026-09-27): 4 suites / 23 tests rojos de 592, 0 sin ejecutar.
      # En el runner remoto sigue NO MEDIDO: el paso de tests queda `skipped` detrás del paso de preparación (CI-46).
      - name: Run Backend Integration & Unit Tests
        env:
          DATABASE_URL: postgres://app_rls_user:ci_only_password@localhost:5432/glowtest
          JWT_SECRET: ci_secret_key_glowapp_2026_super_secure
          RLS_ROLE_PASSWORD: ci_only_password
        run: |
          cd backend
          set -o pipefail
          npm test -- --coverage --testPathIgnorePatterns="geminiService|geminiFallback|auraToolExecutor|contract|biometric|resilience|contextCompressor|fase5|api.cors" 2>&1 | tee /tmp/jest-gate.log

      - name: Publicar salida del gate de tests (anotacion)
        if: failure()
        run: |
          if [ -f /tmp/jest-gate.log ]; then
            if grep -q "failed to run" /tmp/jest-gate.log; then
              TITLE="Salida del gate (suites fallaron al cargar)"
            else
              TITLE="Salida del gate (resumen de ejecucion)"
            fi
            SUMMARY=$(grep -E 'Test Suites:|Tests:' /tmp/jest-gate.log | paste -sd ' · ' -)
            if [ -n "$SUMMARY" ]; then
              echo "::error title=$TITLE::$SUMMARY"
            else
              echo "::error title=$TITLE::No se encontraron líneas de resumen de Jest en /tmp/jest-gate.log"
            fi
            echo "::error title=Ultimas 20 lineas del log del gate::"
            tail -20 /tmp/jest-gate.log | while IFS= read -r l; do echo "::error::$l"; done
          else
            echo "::error title=Resumen del gate::No se encontró /tmp/jest-gate.log"
          fi

      # Deuda visible, no oculta: las 13 suites excluidas del gate se ejecutan igual
      # con `continue-on-error: true` para que su estado real no desaparezca del tablero.
      # Ejecución real en runner remoto: NO VERIFICADO (bloqueado por fallo en el paso 7 antecedente).
      - name: Suites excluidas del gate (no bloqueante)
        continue-on-error: true
        run: |
          cd backend
          # --forceExit: suites que importan index.js dejan handles abiertos (cron,
          # pool, status-monitor) y jest no termina por si solo.
          npm test -- --forceExit --testPathPattern="geminiService|geminiFallback|auraToolExecutor|contract|biometric|resilience|contextCompressor|fase5|api.cors"

  frontend-ci:
    name: Frontend Flutter Analyze & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter Engine
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd frontend
          flutter pub get

      - name: Run Flutter Static Analysis
        run: |
          cd frontend
          flutter analyze --no-fatal-infos --no-fatal-warnings
