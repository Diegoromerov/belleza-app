name: Deploy Admin Dashboard Preview

on:
  pull_request:
    paths:
      - 'admin-dashboard/**'
      - 'railway.json'
      - '.github/workflows/deploy-admin-preview.yml'
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Login to Railway
        run: railway login --token "${{ secrets.RAILWAY_TOKEN }}"

      - name: Link to Railway project
        run: railway link --project grateful-harmony

      - name: Deploy admin-dashboard to preview environment
        run: |
          railway up --service admin-dashboard --environment preview --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Get preview URL
        id: preview-url
        run: |
          URL=$(railway domain --service admin-dashboard --environment preview 2>/dev/null | grep -E '^https?://' | head -1)
          if [ -z "$URL" ]; then
            # Fallback: construct preview URL pattern
            PR_NUMBER=${{ github.event.number }}
            URL="https://admin-dashboard-preview-${PR_NUMBER}.up.railway.app"
          fi
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Preview URL: $URL"

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = "${{ steps.preview-url.outputs.url }}";
            const pr = ${{ github.event.number }};
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              body: `🚀 **Preview Deployment Ready**\n\nAdmin Dashboard preview: **${url}**\n\n*Esta URL es temporal y se actualiza en cada push al PR.*`
            });