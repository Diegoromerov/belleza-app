name: GlowApp Firebase Deploy

on:
  push:
    branches: [ staging, main ]
  pull_request:
    branches: [ main ]

env:
  FLUTTER_CHANNEL: stable
  FLUTTER_VERSION: '3.29.2'
  RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}

jobs:
  # ─────────────────────────────────────────────────────────────────
  # BACKEND CI + Deploy to Railway
  # ─────────────────────────────────────────────────────────────────
  backend-ci:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: glowtest
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [ 5432, 5432 ]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      JWT_SECRET: ci_secret_key_glowapp_2026_super_secure
      PORT: 3000
      DATABASE_URL_ADMIN: postgres://postgres:***@localhost:5432/glowtest
      RLS_ROLE_PASSWORD: ci_only_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.x', cache: 'npm', cache-dependency-path: backend/package-lock.json }
      - name: Install Backend Dependencies
        run: cd backend && npm ci --legacy-peer-deps
      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -U postgres && echo "PostgreSQL ready" && break
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done
      - name: Compuerta anti-marcadores de conflicto
        run: cd backend && node scripts/checkNoConflictMarkers.js
      - name: Escaneo de credenciales versionadas
        run: cd backend && node scripts/verifyNoVersionedSecrets.js
      - name: Guard de numeracion de migraciones
        run: cd backend && node tests/migrationsNoDuplicateNumbers.test.js
      - name: Guardas node:test
        run: |
          cd backend
          set -o pipefail
          npm run test:node 2>&1 | tee /tmp/node-tests.log
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::Guardas node:test en rojo (exit $rc)"
            tail -25 /tmp/node-tests.log | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $rc
      - name: Compuerta de contrato OpenAPI
        run: |
          cd backend
          set -o pipefail
          node scripts/checkOpenApiSpec.js 2>&1 | tee /tmp/openapi-drift.log
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::Compuerta de contrato OpenAPI en rojo (exit $rc)"
            tail -30 /tmp/openapi-drift.log | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $rc
      - name: Tests de contrato
        run: |
          cd backend
          set -o pipefail
          npx jest src/tests/contract/openapi.contract.test.js src/tests/contract/critical-endpoints.contract.test.js src/tests/contract/routersMontados.contract.test.js --runInBand --forceExit 2>&1 | tee /tmp/contract-tests.log
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::Tests de contrato en rojo (exit $rc)"
            grep -E 'Tests:|Test Suites:' /tmp/contract-tests.log | paste -sd ' . ' - | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $rc
      - name: Preparar esquema multi-tenant y roles RLS
        run: |
          cd backend
          set -o pipefail
          node scripts/prepareRlsDatabase.js 2>&1 | tee /tmp/prep-rls.log
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::prepareRlsDatabase.js fallo con exit $rc - ultimas 20 lineas:"
            tail -20 /tmp/prep-rls.log | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $rc
      - name: Verificar aislamiento multi-tenant (RLS)
        continue-on-error: true
        env:
          TEST_DATABASE_URL: postgres://app_owner:***@localhost:5432/glowtest
        run: |
          cd backend
          set -o pipefail
          node scripts/verifyTenantIsolation.js 2>&1 | tee /tmp/verify-rls.log
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::warning::verifyTenantIsolation.js fallo con exit $rc (requiere PostgreSQL vivo con roles RLS) - ultimas 20 lineas:"
            tail -20 /tmp/verify-rls.log | while IFS= read -r l; do echo "::warning::$l"; done
          else
            echo "[OK] Verificacion RLS exitosa"
          fi
      - name: Run Backend Integration & Unit Tests
        env:
          DATABASE_URL: postgres://app_rls_user:***@localhost:5432/glowtest
          JWT_SECRET: ci_secret_key_glowapp_2026_super_secure
          RLS_ROLE_PASSWORD: ci_only_password
        run: |
          cd backend
          set -o pipefail
          npm test -- --coverage --testPathIgnorePatterns="geminiService|geminiFallback|auraToolExecutor|contract|biometric|resilience|contextCompressor|fase5|api.cors" 2>&1 | tee /tmp/jest-gate.log

  deploy-backend-railway:
    name: Deploy Backend to Railway
    needs: backend-ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: { node-version: '22.x' }

      - name: Install Railway CLI
        run: npm install -g @railway/cli@2

      - name: Deploy Backend to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          cd backend
          echo "$RAILWAY_TOKEN" | railway login --browserless --stdin
          railway link
          railway service glowapp-api
          railway up

  # ─────────────────────────────────────────────────────────────────
  # MONOREPO SETUP (shared for frontend jobs)
  # ─────────────────────────────────────────────────────────────────
  monorepo-setup:
    name: Monorepo Setup & Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Setup Dart/Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('**/pubspec.yaml', '**/pubspec.lock') }}

      - name: Install Melos
        run: dart pub global activate melos 6.2.0

      - name: Add Melos to PATH
        run: echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Melos Bootstrap
        run: melos bootstrap
        working-directory: ${{ github.workspace }}

      - name: Melos Analyze (all packages)
        run: |
          echo "Analyzing glow_core..."
          cd ${{ github.workspace }}/packages/glow_core && flutter analyze --no-fatal-infos --no-fatal-warnings
          echo "Analyzing glow_client..."
          cd ${{ github.workspace }}/apps/glow_client && flutter analyze --no-fatal-infos --no-fatal-warnings
          echo "Analyzing glow_provider..."
          cd ${{ github.workspace }}/apps/glow_provider && flutter analyze --no-fatal-infos --no-fatal-warnings
        working-directory: ${{ github.workspace }}

  # ─────────────────────────────────────────────────────────────────
  # GLOW_CLIENT - Test & Build
  # ─────────────────────────────────────────────────────────────────
  glow-client-verify:
    name: Glow Client - Test & Build
    needs: monorepo-setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Setup Dart/Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Restore Melos Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.dart_tool
            ${{ github.workspace }}/packages/glow_core/.dart_tool
            ${{ github.workspace }}/apps/glow_client/.dart_tool
            ${{ github.workspace }}/apps/glow_provider/.dart_tool
          key: melos-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml', '**/pubspec.lock', 'melos.yaml') }}

      - name: Melos Bootstrap
        run: melos bootstrap
        working-directory: ${{ github.workspace }}

      - name: Run Glow Client Tests
        run: cd apps/glow_client && flutter test
        working-directory: ${{ github.workspace }}

      - name: Build Glow Client Web
        run: |
          cd apps/glow_client
          flutter build web --release \
            --dart-define=FIREBASE_API_KEY=${{ secrets.CLIENT_FIREBASE_API_KEY }} \
            --dart-define=FIREBASE_PROJECT_ID=${{ secrets.CLIENT_FIREBASE_PROJECT_ID }} \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ secrets.CLIENT_FIREBASE_MESSAGING_SENDER_ID }} \
            --dart-define=FIREBASE_STORAGE_BUCKET=${{ secrets.CLIENT_FIREBASE_STORAGE_BUCKET }} \
            --dart-define=FIREBASE_WEB_APP_ID=${{ secrets.CLIENT_FIREBASE_WEB_APP_ID }} \
            --dart-define=FIREBASE_ANDROID_APP_ID=${{ secrets.CLIENT_FIREBASE_ANDROID_APP_ID }} \
            --dart-define=FIREBASE_IOS_APP_ID=${{ secrets.CLIENT_FIREBASE_IOS_APP_ID }} \
            --dart-define=APP_AUDIENCE=client
        working-directory: ${{ github.workspace }}

      - name: Upload Client Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: glow-client-web
          path: apps/glow_client/build/web/
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────
  # GLOW_PROVIDER - Test & Build
  # ─────────────────────────────────────────────────────────────────
  glow-provider-verify:
    name: Glow Provider - Test & Build
    needs: monorepo-setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Setup Dart/Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Restore Melos Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.dart_tool
            ${{ github.workspace }}/packages/glow_core/.dart_tool
            ${{ github.workspace }}/apps/glow_client/.dart_tool
            ${{ github.workspace }}/apps/glow_provider/.dart_tool
          key: melos-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml', '**/pubspec.lock', 'melos.yaml') }}

      - name: Melos Bootstrap
        run: melos bootstrap
        working-directory: ${{ github.workspace }}

      - name: Run Glow Provider Tests
        run: cd apps/glow_provider && flutter test
        working-directory: ${{ github.workspace }}

      - name: Build Glow Provider Web
        run: |
          cd apps/glow_provider
          flutter build web --release \
            --dart-define=FIREBASE_API_KEY=${{ secrets.PROVIDER_FIREBASE_API_KEY }} \
            --dart-define=FIREBASE_PROJECT_ID=${{ secrets.PROVIDER_FIREBASE_PROJECT_ID }} \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ secrets.PROVIDER_FIREBASE_MESSAGING_SENDER_ID }} \
            --dart-define=FIREBASE_STORAGE_BUCKET=${{ secrets.PROVIDER_FIREBASE_STORAGE_BUCKET }} \
            --dart-define=FIREBASE_WEB_APP_ID=${{ secrets.PROVIDER_FIREBASE_WEB_APP_ID }} \
            --dart-define=FIREBASE_ANDROID_APP_ID=${{ secrets.PROVIDER_FIREBASE_ANDROID_APP_ID }} \
            --dart-define=FIREBASE_IOS_APP_ID=${{ secrets.PROVIDER_FIREBASE_IOS_APP_ID }} \
            --dart-define=APP_AUDIENCE=provider
        working-directory: ${{ github.workspace }}

      - name: Upload Provider Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: glow-provider-web
          path: apps/glow_provider/build/web/
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────
  # DEPLOY FRONTENDS TO FIREBASE HOSTING
  # ─────────────────────────────────────────────────────────────────
  deploy-client-firebase:
    name: Deploy Client to Firebase Hosting
    needs: [glow-client-verify, backend-ci]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Download Client Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: glow-client-web
          path: apps/glow_client/build/web

      - name: Deploy to Firebase Hosting (Client)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.CLIENT_FIREBASE_SERVICE_ACCOUNT }}
          projectId: glowapp-client
          target: client
          entryPoint: apps/glow_client
          channelId: ${{ github.ref == 'refs/heads/main' && 'live' || 'staging' }}
          expires: 7d

  deploy-provider-firebase:
    name: Deploy Provider to Firebase Hosting
    needs: [glow-provider-verify, backend-ci]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Download Provider Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: glow-provider-web
          path: apps/glow_provider/build/web

      - name: Deploy to Firebase Hosting (Provider)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.PROVIDER_FIREBASE_SERVICE_ACCOUNT }}
          projectId: glowapp-provider
          target: provider
          entryPoint: apps/glow_provider
          channelId: ${{ github.ref == 'refs/heads/main' && 'live' || 'staging' }}
          expires: 7d