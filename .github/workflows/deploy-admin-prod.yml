name: Deploy Admin Dashboard Production

on:
  push:
    branches: [main]
    paths:
      - 'admin-dashboard/**'
      - 'railway.json'
      - '.github/workflows/deploy-admin-prod.yml'

permissions:
  contents: read

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Login to Railway
        run: railway login --token "${{ secrets.RAILWAY_TOKEN }}"

      - name: Link to Railway project
        run: railway link --project grateful-harmony

      - name: Deploy admin-dashboard to production
        run: |
          railway up --service admin-dashboard --environment production --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Verify production deployment
        run: |
          sleep 10
          railway status --service admin-dashboard --environment production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}