name: glowapp
packages:
  - packages/*
  - apps/*
scripts:
  bootstrap: melos bootstrap && cd apps/glow_client && flutter pub get && cd ../glow_provider && flutter pub get
  analyze: melos exec -- flutter analyze --no-fatal-infos --no-fatal-warnings
  test: melos exec -- flutter test
  build:client: cd apps/glow_client && flutter build web --release --dart-define=APP_AUDIENCE=client
  build:provider: cd apps/glow_provider && flutter build web --release --dart-define=APP_AUDIENCE=provider
