name: beauty_app
description: Plataforma de servicios de belleza con geolocalización
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  shared_preferences: ^2.2.2
  google_sign_in: ^6.2.1
  flutter_secure_storage: ^9.0.0
  geocoding: ^3.0.0
  cupertino_icons: ^1.0.6
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  image_picker: ^1.0.7
  js: ^0.6.7
  web_socket_channel: ^3.0.1
  geolocator: ^10.1.0
  webview_flutter: ^4.8.0
  shimmer: ^3.0.0
  camera: ^0.10.5
  google_mlkit_face_detection: ^0.10.0
  mobile_scanner: ^5.0.0
  path_provider: ^2.1.2
  image: ^4.1.3
  flutter_svg: ^2.0.9
  lottie: ^3.0.0
  provider: ^6.1.1
  flutter_markdown_plus: ^0.7.0
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/glowapp.mp3
